name: Train Battery AI Models

on:
  push:
    paths:
      - "data/battery_data.csv"
      - "train_model.py"
      - ".github/workflows/train-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn==1.7.2 joblib>=1.3,<2

      - name: Train models
        run: python train_model.py --data data/battery_data.csv

      - name: Commit trained models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rul_model.pkl reusable_model.pkl
          git diff --cached --quiet || git commit -m "Train deployment-ready battery AI models"
          git push
